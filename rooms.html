<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Color Clash Rooms</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><a class="brand" href="index.html">COLOR <span>CLASH</span></a><p>Online room lobby</p></header><section id="choice" class="setup card"><p class="eyebrow">ONLINE MULTIPLAYER</p><h1>Bring the <em>table together.</em></h1><p>Create a private room for your friends, or join one with an invite code.</p><button id="showCreate" class="primary">Create a room <span>→</span></button><button id="showJoin" class="quiet">Join a room</button></section><section id="form" class="setup card hidden"><p id="formKicker" class="eyebrow"></p><h2 id="formTitle"></h2><p><input id="name" maxlength="20" placeholder="Your name"></p><p id="roomField" class="hidden"><input id="room" maxlength="6" placeholder="Room code"></p><p id="capacityField">Maximum players<br><button class="count active" data-capacity="2">2</button><button class="count" data-capacity="3">3</button><button class="count" data-capacity="4">4</button></p><button id="submit" class="primary">Continue <span>→</span></button><p id="error"></p></section><section id="lobby" class="setup card hidden"><p class="eyebrow">ROOM LOBBY</p><h2>Room <span id="code"></span></h2><p id="invite"></p><p id="members"></p><button id="start" class="primary hidden">Start game <span>→</span></button><p id="waiting">Waiting for friends…</p></section></main><script src="rooms.js"></script></body></html>
